name: my

x-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

volumes:
  sing-box-data:

networks:
  proxy:
    driver: bridge

services:
  auth-thu-deauth:
    logging: *default-logging
    # 和 auth-thu 共用同一个镜像（由 auth-thu 的 build 构建），不单独构建，也不从远程拉取
    image: my-auth-thu
    pull_policy: never
    container_name: auth-thu-deauth
    network_mode: host
    # 必须和 sing-box TUN 的 exclude_uid 一致：认证、DNS 和健康检查都不经过代理
    user: "61001:61001"
    dns:
      - 166.111.8.28
      - 166.111.8.29
    volumes:
      - ./apps/auth-thu:/conf
    command: ["deauth"]

  auth-thu:
    logging: *default-logging
    image: my-auth-thu
    build:
      context: ./apps/auth-thu
      dockerfile: Dockerfile
      network: host
    container_name: auth-thu
    network_mode: host
    # 必须和 sing-box TUN 的 exclude_uid 一致：认证、DNS 和健康检查都不经过代理
    user: "61001:61001"
    dns:
      - 166.111.8.28
      - 166.111.8.29
    volumes:
      - ./apps/auth-thu:/conf
    command: ["-c", "/conf/auth-thu.json", "auth", "-k"]
    restart: always
    depends_on:
      auth-thu-deauth:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 https://www.baidu.com >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # sing-box gateway：
  # - 配置由 apps/sing-box/generator 生成到 out/，只能通过 apps/sing-box/apply.sh 切换到 live/
  # - 修改镜像版本时要同步改 generator/main.py 里的 IMAGE（用于 check）
  # - 重启请用 apply.sh 或 `docker compose up -d --no-deps sing-box`，不加 --no-deps 会连带重建 auth-thu
  sing-box:
    logging: *default-logging
    image: ghcr.io/sagernet/sing-box:v1.14.4
    container_name: sing-box
    network_mode: host
    restart: always
    command: ["run", "-c", "/conf/gateway.json", "-D", "/var/lib/sing-box"]
    volumes:
      - ./apps/sing-box/live:/conf:ro       # 线上配置和首次启动用的规则集（live/srs）
      - sing-box-data:/var/lib/sing-box     # cache.db：规则集缓存、selector 的选择
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    depends_on:
      auth-thu:
        condition: service_started

  corplink:
    build:
      context: ./apps/corplink
      dockerfile: Dockerfile
      network: host
    container_name: corplink
    hostname: ubuntu
    restart: unless-stopped
    shm_size: 512m
    devices:
        - /dev/net/tun:/dev/net/tun
    cap_add:
        - NET_ADMIN
    ports:
        - "127.0.0.1:8888:8118/tcp"
        - "127.0.0.1:1088:1080/tcp"
    environment:
        COMPANY_CODE: "qingcheng"
    healthcheck:
        test: ["CMD-SHELL", "curl -fsS --noproxy '*' --interface 'if!utun' --connect-timeout 5 --max-time 10 https://git.qcjzai.cn/ >/dev/null || exit 1"]
        interval: 30s
        timeout: 15s
        retries: 3
        start_period: 180s
    depends_on:
      sing-box:
        condition: service_started


  # WebDAV（Zotero 附件、浏览器书签同步），经 tailscale serve 以 /dav 对 tailnet 提供。
  # --baseurl /dav：rclone 自己处理 /dav 前缀，所以 serve 转发时要保留前缀（见 tailscale_serve.sh）。
  # 账号在 apps/webdav/htpasswd（bcrypt，git-crypt 加密），新密码用 `htpasswd -nbB zrx <密码>` 生成。
  # 数据目录里的文件历史上由 root 写入，所以容器保持以 root 运行。
  webdav:
    logging: *default-logging
    image: rclone/rclone:latest
    container_name: webdav
    restart: unless-stopped
    command: ["serve", "webdav", "/data", "--addr", ":8080", "--baseurl", "/dav", "--htpasswd", "/conf/htpasswd"]
    environment:
      - TZ=Asia/Shanghai
    ports:
      - 127.0.0.1:8084:8080
    networks: [proxy]
    volumes:
      - ${DISK_ROOT:-${HOME}/disk}/webdav:/data
      - ./apps/webdav/htpasswd:/conf/htpasswd:ro

  vault:
    logging: *default-logging
    image: vaultwarden/server:latest
    container_name: vault
    restart: unless-stopped
    environment:
      DOMAIN: "https://hub.angora-wall.ts.net/vault"
      SIGNUPS_ALLOWED: "false"
      TZ: "Asia/Shanghai"
      LOG_FILE: "/data/vault.log"
      LOG_LEVEL: "info"
    env_file:
      - ./secret-vars.env
    volumes:
      - ${DISK_ROOT:-${HOME}/disk}/vaultwarden:/data
    ports:
      - 127.0.0.1:8082:80
    networks: [proxy]

  gitea:
    logging: *default-logging
    image: gitea/gitea:latest-rootless
    container_name: gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - TZ=Asia/Shanghai
    ports:
      - 127.0.0.1:8083:3000
      # 内置 ssh 服务，经 tailscale serve 的 tcp 10022 对 tailnet 开放；git remote 用 ssh 别名 gitea
      - 127.0.0.1:10022:2222
    networks: [proxy]
    volumes:
      - ./apps/gitea:/etc/gitea
      - ${DISK_ROOT:-${HOME}/disk}/gitea:/var/lib/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
